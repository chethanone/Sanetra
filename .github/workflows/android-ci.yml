name: Sanetra Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/final_app
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        # Keep info-level deprecation notices visible without failing CI.
        # Warnings and errors remain fatal.
        run: flutter analyze lib test --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build CI validation APK (release variant; debug-signed without local keystore)
        run: flutter build apk --release --flavor visionmission -t lib/main.dart

      - name: Upload CI-only APK artifact (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: sanetra-ci-validation-debug-signed-apk
          path: app/final_app/build/app/outputs/flutter-apk/app-visionmission-release.apk
